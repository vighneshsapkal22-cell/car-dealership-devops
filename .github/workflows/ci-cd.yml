name: Car Dealership CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run automated tests
        run: |
          pytest -v

      - name: Build Docker image
        run: |
          docker build -t car-dealership:latest .

      - name: Verify Docker image
        run: |
          docker images car-dealership

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag car-dealership:latest ghcr.io/${{ github.repository_owner }}/car-dealership:latest

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/car-dealership:latest